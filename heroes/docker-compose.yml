services:
    db:
        image: postgres:latest
        container_name: heroes-db
        restart: always
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "25432:5432"
        volumes:
            - ./pg:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
            interval: 5s
            timeout: 5s
            retries: 5
