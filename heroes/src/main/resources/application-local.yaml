spring:
    main:
        banner-mode: off
        web-application-type: servlet
        allow-bean-definition-overriding: true
    application:
        name: heroes
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://127.0.0.1:5432/rooms
        username: postgres
        password: postgres
    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: on
        show-sql: on
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
server:
    port: 9097
    http2:
        enabled: true
    compression:
        enabled: true

logging:
    level:
        root: INFO
        ru.mifi.practice.voln: DEBUG
    charset:
        console: UTF-8
management:
    endpoints:
        web:
            exposure:
                include: '*'
    endpoint:
        health:
            show-details: always
app:
    telegram:
        bot:
            token: ${TELEGRAM_BOT_TOKEN}
            username: Маргинал
