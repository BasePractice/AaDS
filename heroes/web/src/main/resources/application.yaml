spring:
    main:
        banner-mode: off
        web-application-type: servlet
        allow-bean-definition-overriding: true
    application:
        name: heroes
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://heroes-db:5432/postgres
        username: postgres
        password: postgres
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: on
        show-sql: on
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
server:
    port: 9097
    http2:
        enabled: true
    compression:
        enabled: true

logging:
    level:
        root: INFO
        ru.mifi.practice.voln: DEBUG
    charset:
        console: UTF-8
management:
    endpoints:
        web:
            exposure:
                include: 'health,info,prometheus'
    endpoint:
        health:
            show-details: always
app:
    jwt:
        secret: ${JWT_SECRET}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9097}
    admin:
        password: ${ADMIN_PASSWORD:}
    telegram:
        bot:
            token: ${TELEGRAM_BOT_TOKEN}
            username: Маргинал
